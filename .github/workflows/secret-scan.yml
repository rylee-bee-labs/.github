name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@0973e4167ff88353f3789f08ea64ff3926eb7559
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
