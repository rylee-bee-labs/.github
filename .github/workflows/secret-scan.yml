name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@b20d10aeade2b91042d0a6202e0eb9e28d06b7e4
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
