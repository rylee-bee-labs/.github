name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    uses: rylee-bee-labs/ci-harness/.github/workflows/reusable-secret-scan.yml@a137891d367435a79e6ecea6ba39fa5ed23a59ed
    with:
      runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
